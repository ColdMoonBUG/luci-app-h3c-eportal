name: Build ImmortalWrt 24.10.2 package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_BASE_URL: https://downloads.immortalwrt.org/releases/24.10.2/targets/mediatek/filogic
  SDK_ARCHIVE: immortalwrt-sdk-24.10.2-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: ImmortalWrt 24.10.2 / mediatek-filogic (aarch64_cortex-a53)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang curl flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd

      - name: Download and extract SDK
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$SDK_ARCHIVE" "$SDK_BASE_URL/$SDK_ARCHIVE"
          mkdir openwrt-sdk
          tar --zstd --extract --file "$SDK_ARCHIVE" \
            --directory openwrt-sdk --strip-components=1

      - name: Update feeds
        run: |
          set -x
          cd openwrt-sdk
          ./scripts/feeds update -a

      - name: Install feeds
        run: |
          set -x
          cd openwrt-sdk
          ./scripts/feeds install -a

      - name: Copy package into SDK tree
        run: |
          set -x
          rm -rf openwrt-sdk/package/luci-app-nbtverify
          mkdir -p openwrt-sdk/package/luci-app-nbtverify
          rsync -a \
            --exclude openwrt-sdk \
            --exclude .git \
            --exclude bin \
            --exclude .github \
            "$GITHUB_WORKSPACE"/. openwrt-sdk/package/luci-app-nbtverify/
          ls -la openwrt-sdk/package/luci-app-nbtverify/

      - name: Select package
        run: |
          cd openwrt-sdk
          echo 'CONFIG_PACKAGE_luci-app-nbtverify=m' >> .config
          make defconfig
          grep -qx 'CONFIG_PACKAGE_luci-app-nbtverify=m' .config || {
            echo "Package was not selected" >&2
            exit 1
          }

      - name: Build package
        run: |
          cd openwrt-sdk
          make package/luci-app-nbtverify/compile -j"$(nproc)" V=s

      - name: Collect and verify package
        run: |
          mkdir output
          find openwrt-sdk/bin/packages -type f -name 'luci-app-nbtverify_*.ipk' \
            -exec cp --target-directory=output {} +
          find output -maxdepth 1 -type f -name '*.ipk' -print -quit | grep -q . || {
            echo "Missing package" >&2
            exit 1
          }
          (cd output && sha256sum -- *.ipk > SHA256SUMS)
          ls -lh output

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.2-mediatek-filogic-package
          path: |
            output/*.ipk
            output/SHA256SUMS
          if-no-files-found: error

      - name: Read version
        id: ver
        run: |
          VER=$(awk '/^Version:/{print $2}' control/control)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Tagging v$VER"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: luci-app-nbtverify ${{ steps.ver.outputs.version }}
          body: |
            ImmortalWrt 24.10.2 / mediatek filogic (aarch64_cortex-a53) build.
            H3C eportal (Haijun) auto-login, LuCI2 web UI, procd service.
          files: |
            output/*.ipk
            output/SHA256SUMS
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
